# config.toml — start: переносимый сетап машины. Домены разведены в самой
# структуре TOML (не только баннерами):
#   • [ai]      — единый каталог для Claude Code и Codex;
#   • [files]   ($HOME)     — dotfiles ([[files.dotfiles]]).
# Секции AI вложены в [ai] ([[ai.skills]], [[ai.agents]], [[ai.plugins]],
# [[ai.mcp]], [[ai.hooks]], [ai.statusline], [ai.platforms]);
# домен Files — в [files] ([[files.dotfiles]]).
#
# CLAUDE.md и rules НЕ настраиваются здесь — источник фиксирован в репо
# (ai/instructions/global.md и ai/rules/*.md), адаптируются автоматически.
#
# Локальный overlay
# -----------------
# config.local.toml (gitignore) переопределяет `enabled` источников для ТЕКУЩЕЙ машины
# и может добавлять machine-only MCP через собственные [[ai.mcp]].
# Формат остаётся ПЛОСКИМ: [local.<section>] "<key>" = <enabled>, где section ∈ skills/
# agents/plugins/mcp; key — path источника (или name для mcp). Плоским намеренно:
# overlay машино-локальный. Формат: [local.ai.<section>].
# Эффективный enabled = overlay, если ключ есть, иначе значение отсюда.


# ═══════════════════════════════ AI ════════════════════════════════
# Один каталог; backend-ы раскладывают его в Claude Code и Codex.

# --- Скилы --------------------------------------------------------------------
#
# Каждый источник скилов — отдельный [[ai.skills]], включая локальную папку
# repo/ai/skills. Порядок записей задаёт приоритет при конфликте имён (берётся
# первое вхождение).
#
#   path     — путь к папке-источнику относительно корня репо. Внутри неё каждый
#              подкаталог с SKILL.md считается скилом.
#   enabled  — какие скилы включить: ["*"] (все, по умолчанию), список имён папок
#              (["a","c"]) либо [] (ни одного = источник выключен). TUI
#              (`uv run start manage`) правит это поле прямо в этом файле.
#   exclude  — какие скилы вообще не показывать (имена папок). Поверх enabled.
#   requirements — список [[ai.skills.requirements]] = {name, check, hint}: внешние
#              зависимости скилов источника (та же схема, что у [[ai.plugins.requirements]]).
#              check — shell-команда проверки (rc 0 = есть), hint — как поставить.
#              Менеджер при up проверяет и при отсутствии печатает hint (сам НЕ ставит).
#              Применяются ко всем скилам источника; проверяются раз на источник, если
#              включён хотя бы один его скил. Напр. локальный плеер/рантайм для рендера.
#
# Каждый скил в ~/.claude/skills — реальная папка-зеркало с per-file symlink'ами.
# Имя скила = имя его папки. Конфликт имён между источниками — ошибка установки
# (cli сообщит и пропустит дубль).

# Локальные скилы репо.
[[ai.skills]]
path = "ai/skills"
enabled = ["*"]

[[ai.skills]]
path = "contrib/blender-skills"
enabled = ["polyhaven-scene-builder", "threejs-export"]

# lottie — text-to-Lottie: генерация/правка Lottie/Bodymovin JSON под локальный
# Skia Skottie player. Сабмодуль — full app (React/Vite); скилы лежат в skills/,
# берём только text-to-lottie. Скил self-contained (references/ внутри папки).
[[ai.skills]]
path = "contrib/lottie/skills"
enabled = ["*"]
  # Скил рендерит/верифицирует сцены в официальном Skia Skottie player — это app
  # из того же сабмодуля (contrib/lottie), запускается через bun. Без bun плеер не
  # поднять, верификация сцен невозможна. Менеджер проверяет bun и подсказывает.
  [[ai.skills.requirements]]
  name = "bun"
  check = "command -v bun"
  hint = "curl -fsSL https://bun.sh/install | bash  (или brew install oven-sh/bun/bun). Затем плеер: cd contrib/lottie && bun install && bun dev"

# Один универсальный frontend-design skill без plugin hooks и companion agents.
[[ai.skills]]
path = "contrib/impeccable/.agents/skills"
enabled = ["impeccable"]

[[ai.skills]]
path = "contrib/gravity-ui-skills/skills"
enabled = ["gravity-ui"]

[[ai.skills]]
path = "contrib/threejs-game-skills/skills"
enabled = ["threejs-debug-profiler", "threejs-game-ui-designer"]

# Claude использует те же skills напрямую: плагин Game Studio имеет только Codex manifest.
[[ai.skills]]
path = "contrib/openai-plugins/plugins/game-studio/skills"
enabled = ["*"]
platforms = ["claude"]

# --- Агенты -------------------------------------------------------------------
#
# Каждый источник агентов — отдельный [[ai.agents]] (репо + сабмодули). path → папка
# с *.md-агентами; имя файла без .md = имя агента в ~/.claude/agents. Поля
# path/enabled/exclude — как у [[ai.skills]] (enabled — имена без .md). Конфликт имён —
# первое вхождение (как у скилов). У агентов нет TUI-toggle, но enabled-список тоже
# действует: линкуются только включённые им. (Агенты плагинов идут через [[ai.plugins]].)

[[ai.agents]]
path = "ai/agents"
enabled = ["*"]

# --- Плагины (нативные CC) ----------------------------------------------------
#
# Источник с .claude-plugin/ (plugin.json + marketplace.json). НЕ симлинкуется:
# менеджер собирает плагин в plugin seed (.seed/) через `claude plugin install` и
# отдаёт CC через CLAUDE_CODE_PLUGIN_SEED_DIR. CC сам подключает skills/agents/
# commands/hooks/MCP плагина. Требует `claude` в PATH (иначе фаза пропускается).
#
#   path     — корень плагина (каталог с .claude-plugin/).
#   enabled  — bool: включить плагин целиком (плагин атомарен).
#   marketplace / plugin — override имён, если автодетект из манифеста не сработал.
#   codex_exclude_skills — скилы плагина, которые не надо включать в Codex bundle.
#   [[ai.plugins.requirements]] — внешние зависимости плагина (бинари): name/check/hint.
#              `check` — shell-команда проверки (rc 0 = есть), `hint` — как поставить.
#              Менеджер при up проверяет и при отсутствии печатает hint (сам НЕ ставит).

[[ai.plugins]]
path = "contrib/claude-seo"
enabled = false

[[ai.plugins]]
path = "contrib/infostyle-skill"
enabled = true

[[ai.plugins]]
path = "contrib/text-to-cad"
enabled = true
codex_exclude_skills = ["bambu-labs"]

[[ai.plugins]]
path = "contrib/ponytail"
enabled = true

[[ai.plugins]]
path = "contrib/ui-ux-pro-max-skill"
enabled = true
codex_exclude_skills = ["banner-design", "brand", "design", "slides", "ui-styling"]

# ast-index — структурный поиск по коду (символы/вызовы/иерархии) вместо grep.
# Плагин даёт скил/правила/команды; сам бинарь ast-index ставится отдельно (см.
# [[ai.plugins.requirements]]). Команды: search/usages/implementations/callers/outline/...
[[ai.plugins]]
path = "contrib/ast-index"
enabled = true
  # Бинарь ast-index не входит в плагин — менеджер проверяет наличие и подсказывает.
  [[ai.plugins.requirements]]
  name = "ast-index"
  check = "command -v ast-index"
  hint = "brew tap defendend/ast-index && brew trust defendend/ast-index && brew install ast-index"

[[ai.plugins]]
path = "contrib/Understand-Anything"
enabled = true

[[ai.plugins]]
path = "contrib/openai-plugins/plugins/game-studio"
enabled = true
platforms = ["codex"]

# --- MCP-серверы (user-scope) -------------------------------------------------
#
# Глобальные (user-scope) MCP: менеджер пишет включённые в ~/.claude.json (top-level
# mcpServers) — CC читает MCP только оттуда, НЕ из settings.json. inline-спека
# [ai.mcp.server] (command/args/env | url/headers); env ${VAR} как литерал.
#   name     — имя сервера в ~/.claude.json.
#   enabled  — bool. Машино-специфично переопределяется через
#              config.local.toml ([local.ai.mcp]). Секретные и machine-only серверы
#              целиком объявляются как [[ai.mcp]] в config.local.toml.
[[ai.mcp]]
name = "playwright"
enabled = true
[ai.mcp.server]
command = "npx"
args = ["@playwright/mcp@latest"]

[[ai.mcp]]
name = "figma"
enabled = true
platforms = ["codex"]
[ai.mcp.server]
url = "https://mcp.figma.com/mcp"
oauth_resource = "https://mcp.figma.com/mcp"

# --- Env (переменные окружения в ~/.claude/settings.json) ---------------------
#
# Произвольные env для CC, менеджер мержит их в settings.json `env` (managed, sidecar).
# ENABLE_CLAUDEAI_MCP_SERVERS=false — отключить claude.ai connectors (напр. Google Drive),
# которые синхронятся из аккаунта claude.ai, а не из этого репо.
[ai.platforms.claude.env]
ENABLE_CLAUDEAI_MCP_SERVERS = "false"

[ai.platforms.codex.features]
apps = false

[ai.platforms.codex.plugins]
# Для выключенных plugins менеджер также отключает их SKILL.md, чтобы они не
# занимали ограниченный индекс skills и не вытесняли пользовательские навыки.
"browser@openai-bundled" = false
"documents@openai-primary-runtime" = false
"figma@openai-curated" = false
"openai-templates@openai-curated-remote" = false
"plugin-management@openai-curated-remote" = false
"presentations@openai-primary-runtime" = false
"sites@openai-bundled" = false
"spreadsheets@openai-primary-runtime" = false
"template-creator@openai-primary-runtime" = false

[ai.platforms.codex.skills]
# Имена user skills из ~/.codex/skills; менеджер пишет штатные [[skills.config]]
# с абсолютным путём для текущего CODEX_HOME.
canvas-design = false

# --- Statusline --------------------------------------------------------------
#
# Своя плашка статусбара. Файл линкуется в ~/.claude/<dest>, а settings.json
# `statusLine` прописывается менеджером (managed, через sidecar). Убери секцию —
# менеджер снимет statusLine (по sidecar), не трогая чужой.

[ai.statusline.claude]
path = "ai/statusline/statusline.mjs"   # *.mjs/*.sh относительно корня репо
dest = "statusline.mjs"              # имя в ~/.claude/
command = "node ${CLAUDE_CONFIG_DIR:-$HOME/.claude}/statusline.mjs"
  # Команда statusline требует node (файл — .mjs). Без node CC молча не запускает
  # статусбар (плашка не появляется) — менеджер проверяет наличие и подсказывает.
  [[ai.statusline.claude.requirements]]
  name = "node"
  check = "command -v node"
  hint = "1. Install nvm (https://github.com/nvm-sh/nvm)  2. nvm install --lts"

# --- Hooks (авто-регистрация событий) -----------------------------------------
#
# Зарегистрировать loose-hook в runtime каждой платформы. events принимает общий
# список либо таблицу { claude = [...], codex = [...] } для разных нативных событий.
# Файл симлинкается в runtime hooks/, команда прописывается в managed-конфиг.

[ai.statusline.codex]
items = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining", "five-hour-limit", "weekly-limit", "fast-mode"]
use_colors = true


# ══════════════════════════════ FILES ══════════════════════════════
# Домен $HOME: общий сетап машины, не про Claude Code.

# --- Dotfiles (симлинки в $HOME + опциональный posthook) ----------------------
#
# Переносимые dotfiles машины: файл/папка репо → симлинк в $HOME, и/или posthook.
#   source   — путь к файлу/папке относительно корня репо (обязателен).
#   target   — путь в $HOME (поддержка ~ и абсолютных; недостающие родительские
#              каталоги создаются). Опционален: без него symlink не ставится
#              (запись только для posthook).
#   posthook — shell-команда после раскладки записи (опциональна). Доверенный shell
#              из версионного config; выполняется в корне репо, в env доступны
#              SOURCE (абс. путь source) и TARGET (развёрнутый target или ""). Должна
#              быть идемпотентной — гоняется на каждом up.
# Чужой файл на target: backup в <name>.bak при `start up --force`, иначе пропуск с
# предупреждением. Наш корректный симлинк — idempotent (пропуск). Прун снятых записей
# НЕ делается (небезопасно итерировать $HOME) — убрал запись, симлинк снимаешь сам.
# Файлы хранить в dotfiles/ (без ведущей точки — точка в target).
[[ai.hooks]]
path = "ai/hooks/notify.sh"
events = { claude = ["Stop", "Notification"], codex = ["Stop"] }

[[ai.hooks]]
path = "ai/hooks/focus-track.sh"
events = ["UserPromptSubmit"]
platforms = ["claude"]

[[files.dotfiles]]
source = "dotfiles/vimrc"
target = "~/.vimrc"

# iTerm2 — настройки хранятся в репо через нативную фичу «Load preferences from a
# custom folder». iTerm читает/пишет com.googlecode.iterm2.plist из указанной папки
# (dotfiles/iterm) — это НЕ симлинк в $HOME (потому target нет), а posthook, который
# указывает iTerm на папку репо. Двусторонний sync: правки в iTerm сохраняются обратно
# в репо (включить «Save changes … when iTerm2 quits» в настройках iTerm).
[[files.dotfiles]]
source = "dotfiles/iterm"
posthook = 'defaults write com.googlecode.iterm2 PrefsCustomFolder -string "$SOURCE" && defaults write com.googlecode.iterm2 LoadPrefsFromCustomFolder -bool true'

# OrcaSlicer — пользовательские machine/process/filament профили живут в git.
# Orca пишет новые и изменённые профили прямо через этот managed symlink.
[[files.dotfiles]]
source = "dotfiles/orcaslicer/default/filament"
target = "~/Library/Application Support/OrcaSlicer/user/default/filament"

[[files.dotfiles]]
source = "dotfiles/orcaslicer/default/process"
target = "~/Library/Application Support/OrcaSlicer/user/default/process"


# ══════════════════════════════ COMMANDS ══════════════════════════════
# Домен «Команды»: разовые действия на машине, запускаемые из TUI по требованию
# (не про провижининг — up их не трогает). Каждая [[commands.tasks]] — команда с
# вариантами запуска по ОС.
#   name        — идентификатор.
#   title       — отображаемое имя.
#   description — что делает.
#   sudo        — для run: пометка (sudo внутри команды); для view: авторизация менеджером.
#   view        — platform → module:function, async provider живой таблицы.
#   refresh     — период обновления view в секундах (по умолчанию 2).
#   category    — заголовок группы в таблице (по умолчанию «Общее»).
#   filters     — поля name/label/default, options для выбора вместо свободного ввода.
# Контракт provider и примеры: .agents/skills/start-add-interactive-task/SKILL.md.
#   [commands.tasks.run] — команда по платформам; ключи по sys.platform
#                 (darwin/linux/win32). На текущей ОС берётся run[sys.platform];
#                 нет ключа под неё → команда недоступна здесь (TUI пометит).

[[commands.tasks]]
name = "flush-dns"
category = "Сеть"
title = "Сбросить DNS-кеш"
description = "Очистить кеш DNS-резолвера операционной системы."
sudo = true
[commands.tasks.run]
darwin = "sudo dscacheutil -flushcache && sudo killall -HUP mDNSResponder"

# PXE-загрузка: локальный netboot.xyz (Docker) + нативный dnsmasq (proxyDHCP+TFTP) для
# установки старой машины по сети без интернета на ней. Скрипт интерактивный (выбор
# интерфейса), поэтому запускается из TUI с реальным терминалом. Требует OrbStack/Docker
# и `brew install dnsmasq`; разовое предскачивание дистрибутивов — через webUI netboot.xyz.
[[commands.tasks]]
name = "pxe-netboot"
category = "Сеть"
title = "PXE-загрузка (локальный netboot.xyz)"
description = "Локальный PXE-сервер для установки машины по сети без интернета на ней. UEFI+BIOS. Ctrl-C — стоп."
sudo = true
[commands.tasks.run]
darwin = 'bash "$REPO/scripts/pxe/pxe-netboot.sh"'

# Provision: netbook — обустройство headless-Debian нетбука Ansible-ролью netbook
# (scripts/ansible): пакеты (tmux/mosh/mc/fzf/gpm), Wi-Fi (NetworkManager + nmtui), дебаг
# сети/модема, dotfiles. provision.sh <role> прогоняет роль ЛОКАЛЬНО (-c local). Только Linux.
[[commands.tasks]]
name = "provision-netbook"
category = "Система"
title = "Provision: netbook"
description = "Ansible-роль netbook локально: терминал + Wi-Fi (nmtui) + net-debug + dotfiles на headless-Debian. Запускать на нетбуке."
sudo = true
[commands.tasks.run]
linux = 'bash "$REPO/scripts/provision.sh" netbook'

# tcp-listen — слушающие TCP-порты (lsof). Интерактивно спрашивает порт: пусто — все,
# число — фильтр по порту. Замена алиасу `sudo lsof -iTCP -sTCP:LISTEN -n -P` + grep.
[[commands.tasks]]
name = "tcp-listen"
category = "Сеть"
title = "Listening ports"
description = "Живая таблица lsof: TCP LISTEN и UDP-сокеты, фильтры порта и протокола. q — назад."
sudo = true
refresh = 2
[commands.tasks.view]
darwin = "cli.commands.listening_ports:snapshot"
linux = "cli.commands.listening_ports:snapshot"
[[commands.tasks.filters]]
name = "port"
label = "Порт"
[[commands.tasks.filters]]
name = "protocol"
label = "Протокол"
default = "tcp"
options = ["tcp", "udp", "all"]

[[commands.tasks]]
name = "nettop"
category = "Сеть"
title = "Сеть по приложениям"
description = "Живая таблица nettop: приложение или PID, TCP/UDP, трафик соединений. q — назад."
sudo = true
refresh = 2
[commands.tasks.view]
darwin = "cli.commands.network_processes:snapshot"
[[commands.tasks.filters]]
name = "application"
label = "Приложение или PID"
[[commands.tasks.filters]]
name = "protocol"
label = "Протокол"
default = "tcp"
options = ["tcp", "udp", "all"]

[[commands.tasks]]
name = "codex-session-dump"
category = "Codex"
title = "Экспорт сессии Codex"
description = "Сохранить диалог выбранной Codex-сессии в читаемый Markdown."
[commands.tasks.run]
darwin = 'python3 "$REPO/scripts/codex-session-dump.py"'
linux = 'python3 "$REPO/scripts/codex-session-dump.py"'

[[commands.tasks]]
name = "codex-process-tree"
category = "Codex"
title = "Дерево процессов Codex"
description = "Показать процессы Codex и их дочерние процессы с CPU, памятью и временем работы."
[commands.tasks.run]
darwin = 'bash "$REPO/scripts/codex-process-tree.sh"'
linux = 'bash "$REPO/scripts/codex-process-tree.sh"'


[[commands.tasks]]
name = "power-off-after-print"
category = "3D-печать"
title = "Выключить принтер после печати"
description = "Принтер 172.22.222.30: дождаться завершения текущей печати и остывания сопла ниже 50 °C, стола ниже 40 °C, затем выключить питание. Запускать во время печати; Ctrl-C — отмена ожидания."
[commands.tasks.run]
darwin = 'python3 "$REPO/scripts/power_off_after_print.py"'
linux = 'python3 "$REPO/scripts/power_off_after_print.py"'



[[ai.plugins]]
path = "contrib/apple-bento-grid"
enabled = false

[[ai.plugins]]
path = "contrib/openai-plugins/plugins/build-ios-apps"
enabled = false
platforms = ["codex"]

[[ai.plugins]]
path = "contrib/swiftui-agent-skill"
enabled = false

[[ai.plugins]]
path = "contrib/swift-concurrency-agent-skill"
enabled = false

[[ai.plugins]]
path = "contrib/swift-testing-agent-skill"
enabled = false

[[ai.skills]]
path = "contrib/swiftdata-agent-skill"
enabled = []

[[ai.skills]]
path = "contrib/diataxis-agent-skill"
enabled = ["*"]

[[ai.skills]]
path = "contrib/orca/skills"
enabled = ["orca-cli"]

[[ai.skills]]
path = "contrib/skills/skills"
enabled = ["*"]

[[ai.skills]]
path = "contrib/anthropic-skills/skills"
enabled = ["frontend-design"]

[[ai.skills]]
path = "contrib/taste-skill/skills"
enabled = ["taste-skill"]

[[ai.skills]]
path = "contrib/brand-building-skills/skills"
enabled = ["brand-naming"]
exclude = ["brand-guidelines"]

[[ai.plugins]]
path = "contrib/redaktura-skills"
enabled = true

[[ai.plugins]]
path = "contrib/hyperframes"
enabled = true
marketplace = "hyperframes"
plugin = "hyperframes"
  [[ai.plugins.requirements]]
  name = "node>=22"
  check = "command -v node && node -e 'process.exit(+process.versions.node.split(\".\")[0]>=22?0:1)'"
